name: Test & Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Run E2E + functional tests against a LOCAL server ──
  # Tests run against http://localhost:8080 (built from current commit),
  # NOT against prod. This prevents the chicken-and-egg problem where a
  # broken-in-prod test blocks the deploy that would fix it.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # Authenticate to GCP so the local server can talk to Firestore
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/286329122172/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@statusrooster.iam.gserviceaccount.com

      - name: Start local server
        env:
          GCP_PROJECT_ID: statusrooster
          APP_ENV: development
          JWT_SECRET: ci-test-secret-not-used-in-prod
          WORKER_SECRET: ""
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8080 > server.log 2>&1 &
          echo $! > server.pid
          # Wait for server to be ready (max 30s)
          for i in {1..30}; do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "Server up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8080/ > /dev/null || (echo "Server failed to start"; cat server.log; exit 1)

      - name: Run E2E tests
        env:
          SR_BASE_URL: http://localhost:8080
          SR_API_KEY: ${{ secrets.SR_API_KEY }}
        run: pytest tests/test_e2e.py -v --asyncio-mode=auto -k "not slow"

      - name: Run functional tests
        env:
          SR_BASE_URL: http://localhost:8080
          SR_API_KEY: ${{ secrets.SR_API_KEY }}
        run: pytest tests/test_functional.py -v --asyncio-mode=auto

      - name: Stop local server
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi
          if [ -f server.log ]; then echo "=== server.log ==="; tail -50 server.log; fi

  # ── Deploy primary app to Cloud Run ──
  deploy-primary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/286329122172/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@statusrooster.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy primary to us-east1
        run: gcloud run deploy statusrooster --source . --region us-east1 --project statusrooster --quiet

  # ── Check if worker code changed ──
  detect-worker-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      workers_changed: ${{ steps.check.outputs.workers_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          if echo "$CHANGED" | grep -qE '^(checker_core/|worker/|\.github/workflows/deploy\.yml)'; then
            echo "workers_changed=true" >> $GITHUB_OUTPUT
          else
            echo "workers_changed=false" >> $GITHUB_OUTPUT
          fi

  # ── Deploy workers (only if checker_core/ or worker/ changed) ──
  deploy-workers:
    if: needs.detect-worker-changes.outputs.workers_changed == 'true'
    needs: [test, detect-worker-changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/286329122172/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@statusrooster.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build worker image
        run: |
          cp worker/Dockerfile Dockerfile
          BUILD_ID=$(gcloud builds submit . \
            --tag us-east1-docker.pkg.dev/statusrooster/cloud-run-source-deploy/statusrooster-worker \
            --project statusrooster \
            --async --format='value(id)' --quiet)
          echo "Waiting for build $BUILD_ID..."
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project statusrooster --format='value(status)')
            echo "Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then break; fi
            if [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "TIMEOUT" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done

      - name: Deploy workers to all regions
        run: |
          gcloud run deploy statusrooster-worker \
            --image us-east1-docker.pkg.dev/statusrooster/cloud-run-source-deploy/statusrooster-worker \
            --region us-west1 --project statusrooster --quiet &
          gcloud run deploy statusrooster-worker \
            --image us-east1-docker.pkg.dev/statusrooster/cloud-run-source-deploy/statusrooster-worker \
            --region europe-west1 --project statusrooster --quiet &
          gcloud run deploy statusrooster-worker \
            --image us-east1-docker.pkg.dev/statusrooster/cloud-run-source-deploy/statusrooster-worker \
            --region asia-east1 --project statusrooster --quiet &
          wait
