{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block extra_css %}
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to your dashboard.</p>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ email | default('', true) }}" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Your password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('password', this)">👁️</button>
                </div>
            </div>
            <button type="submit" class="auth-submit">Log in</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/signup">Sign up free</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePassword(fieldId, btn) {
    const input = document.getElementById(fieldId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁️';
    }
}
</script>
{% endblock %}
