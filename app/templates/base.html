<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StatusRooster{% endblock %} — StatusRooster 🐓</title>
    <meta name="description" content="{% block description %}Uptime monitoring for indie developers, not enterprises.{% endblock %}">
    <style>
        /* Reset & Base */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #1a1a2e;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: #e63946; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Nav */
        .nav {
            background: #1a1a2e;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-brand {
            color: #fff;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
        }
        .nav-brand:hover { text-decoration: none; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { color: #ccc; font-size: 0.9rem; }
        .nav-links a:hover { color: #fff; text-decoration: none; }

        /* Main Content */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
        }

        /* Footer */
        .footer {
            background: #1a1a2e;
            color: #888;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.85rem;
            margin-top: auto;
        }
        .footer a { color: #ccc; }

        /* Flash Messages */
        .flash { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
        .flash-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .flash-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 0.6rem 1.25rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { text-decoration: none; opacity: 0.9; }
        .btn-primary { background: #e63946; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/" class="nav-brand">🐓 StatusRooster</a>
        <div class="nav-links">
            {% if user %}
                <a href="/dashboard">Dashboard</a>
                <a href="/logout">Log out</a>
            {% else %}
                <a href="/login">Log in</a>
                <a href="/signup" class="btn btn-primary" style="padding: 0.4rem 1rem;">Sign up free</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% if flash_message %}
            <div class="flash flash-{{ flash_type | default('success') }}">{{ flash_message }}</div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <p>© 2026 StatusRooster. Built for indie developers. 🐓</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
